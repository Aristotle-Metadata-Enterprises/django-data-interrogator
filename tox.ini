[tox]
toxworkdir=/tmp/tox
skipsdist = True
envlist =
    dj-{42,52,60} #-db-{pg,sqlite,maria}

[testenv]
passenv =
    DATABASE_URL
    PYTHONPATH

setenv =
    DJANGO_SETTINGS_MODULE = app.settings

    dj-42: DJANGO_VERSION="~=4.2.0"
    dj-52: DJANGO_VERSION="~=5.2.0"
    dj-60: DJANGO_VERSION="~=6.0.0"

deps =
    -e .
    coverage
    setuptools>34.0
    psycopg2
    mysqlclient>1.4.0

    # From poetry
    dj-database-url~=0.5.0
    djangorestframework~=3.15
    drf_yasg>=1.20.0
    django-filter>=21.1
    mock~=4.0.3

commands =
    pip install "django{env:DJANGO_VERSION}"
    coverage run --append --source=. ./app/manage.py test data_interrogator -v 2
